name: "Release Dev Container Features & Generate Documentation"

# Publishes src/* as OCI Dev Container Features to ghcr.io. Modeled
# directly on the official devcontainers/template-starter reference
# workflow (github.com/devcontainers/template-starter), swapping
# publish-templates for publish-features since this repo distributes a
# Feature (agentic-sandbox-firewall), not a whole starting-point
# devcontainer.
#
# Triggered by publishing a GitHub Release (so cutting a release is what
# actually ships the package) or manually via workflow_dispatch.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Publish Features"
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR for Documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config pull.rebase false

          branch="automated-documentation-update-${GITHUB_RUN_ID}"
          git checkout -b "$branch"

          git add src/**/README.md
          git commit -m "Automated documentation update [skip ci]" || export NO_UPDATES=true

          if [ "${NO_UPDATES:-}" != "true" ]; then
            git push origin "$branch"
            gh pr create --title "Automated documentation update" --body "Regenerated Feature option tables from devcontainer-feature.json after the latest publish."
          fi
